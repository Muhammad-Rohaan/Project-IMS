services:
  mongo:
    image: mongo:7
    container_name: irp-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"

  backend:
    build: ./backend
    container_name: irp-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/irp
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  ai:
    build: ./AI_MCQs_Gen
    container_name: mcqs_generator
    restart: unless-stopped
    env_file:
      - ./AI_MCQs_Gen/.env
    environment:
      - NODE_ENV=development
      - PORT=8000
      - MONGO_URI=mongodb://mongo:27017/AZ_MCQsDB
    depends_on:
      - mongo
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend-new
    container_name: irp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:5173"


volumes:
  mongo_data: